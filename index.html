<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral Money Tracker 🍊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Oranžový gradient pozadia */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 0%, #fe9a00 0%, #ff5a00 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }
        .money-glow {
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
        }
        .floating {
            animation: floating 3.5s ease-in-out infinite;
        }
        @keyframes floating {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(1deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="glass p-12 max-w-lg w-full text-center m-4 floating">
        <div id="loading-zone">
            <div class="loader mb-4"></div>
            <p class="text-white font-bold tracking-widest uppercase">Prepočítavam úspech...</p>
        </div>
        
        <div id="result-container" class="hidden">
            <h2 class="text-white text-xl font-bold mb-2 uppercase tracking-widest opacity-90">Referral Systém</h2>
            <h1 class="text-white text-3xl font-black mb-6 leading-tight">Dnes sme pre firmu<br><span class="text-yellow-300">ušetrili / zarobili</span></h1>
            
            <div class="bg-white/20 py-8 rounded-3xl mb-8">
                <div id="amount" class="text-6xl md:text-7xl font-900 text-white money-glow italic font-black">
                    0.00€
                </div>
            </div>

            <p class="text-white bg-orange-600/50 inline-block px-6 py-2 rounded-full text-sm font-bold animate-pulse">
                Aktualizované v reálnom čase 🚀
            </p>
        </div>
    </div>

    <script>
        // Tvoja URL adresa upravená pre export do CSV
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCbg0W3xIYwpGSfHXG3arbbzlnH1FvYq99g1kGubFNNIAnzTJt8lpRLrLX4wpOWfLq8gmfJzsm6q-M/pub?gid=0&single=true&output=csv';

        async function loadData() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                
                // Rozbitie CSV (predpokladáme, že CPI je v A2 a počet v B2)
                const rows = data.split('\n');
                const values = rows[1].split(','); // Riadok 2 (index 1)

                // Ošetrenie čiarky vs bodky v číslach
                const cpi = parseFloat(values[0].replace(',', '.'));
                const registrations = parseInt(values[1]);

                if (isNaN(cpi) || isNaN(registrations)) {
                    throw new Error("Neplatné dáta v tabuľke");
                }

                const total = cpi * registrations;

                // Zobrazenie výsledku
                displayResult(total);

            } catch (error) {
                console.error(error);
                document.getElementById('loading-zone').innerHTML = `
                    <p class="text-white font-bold">Ups! Skontroluj tabuľku. 📋</p>
                `;
            }
        }

        function displayResult(value) {
            const amountEl = document.getElementById('amount');
            const formatted = value.toLocaleString('sk-SK', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + ' €';

            document.getElementById('loading-zone').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');
            
            // Jednoduchá animácia počítadla
            let start = 0;
            const duration = 1500;
            const startTime = performance.now();

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const currentVal = progress * value;
                
                amountEl.innerText = currentVal.toLocaleString('sk-SK', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }) + ' €';

                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            requestAnimationFrame(animate);
        }

        // Spustiť načítanie
        loadData();
    </script>
</body>
</html>
