<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral Machine 💰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #ff5f00;
            background: linear-gradient(135deg, #ff8c00, #ff4500);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: white;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 450px;
        }
        .big-number {
            font-weight: 900;
            font-size: 5rem;
            line-height: 1;
            margin: 20px 0;
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .bounce { animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <div class="glass-card">
        <div id="loading-screen">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white mx-auto mb-4"></div>
            <p class="font-bold uppercase tracking-widest">Počítam profit...</p>
        </div>

        <div id="main-content" class="hidden">
            <div class="inline-block px-4 py-1 rounded-full bg-white text-orange-600 font-black text-xs uppercase mb-4 shadow-sm">
                Live Referral System
            </div>
            <h1 class="text-2xl font-bold uppercase tracking-tight opacity-90">Na referral systéme sme</h1>
            <p class="text-orange-200 text-sm font-bold uppercase mt-1">ušetrili / zarobili</p>
            
            <div id="total-amount" class="big-number">0,00€</div>

            <div class="mt-6 border-t border-white/10 pt-6">
                <p class="italic text-sm opacity-80">"Dobrá práca! Každé euro sa počíta. 🚀"</p>
            </div>
            
            <!-- Tlačidlo na manuálnu obnovu, ak by to seklo -->
            <button onclick="location.reload()" class="mt-8 text-[10px] opacity-30 hover:opacity-100 uppercase font-bold tracking-widest">Aktualizovať dáta</button>
        </div>

        <div id="error-screen" class="hidden">
            <p class="text-4xl">😿</p>
            <p class="font-bold mt-4">Niekde nastala chyba.</p>
            <p id="debug-info" class="text-[10px] mt-4 p-2 bg-black/20 rounded font-mono break-all"></p>
            <button onclick="location.reload()" class="mt-4 bg-white text-orange-600 px-6 py-2 rounded-full font-bold">Skúsiť znova</button>
        </div>
    </div>

    <script>
        // POUŽIJEME INÝ PROXY SERVER (CodeTabs je často stabilnejší pre lokálne testovanie)
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCbg0W3xIYwpGSfHXG3arbbzlnH1FvYq99g1kGubFNNIAnzTJt8lpRLrLX4wpOWfLq8gmfJzsm6q-M/pub?gid=0&single=true&output=csv';
        const PROXY = 'https://api.codetabs.com/v1/proxy?quest=';

        async function start() {
            try {
                // Skúsime načítať cez proxy
                const response = await fetch(PROXY + encodeURIComponent(SHEET_URL));
                if (!response.ok) throw new Error("Nepodarilo sa stiahnuť dáta z tabuľky.");
                
                const csvText = await response.text();
                
                // PARSOVANIE RIADKOV
                const rows = csvText.split(/\r?\n/);
                let cpi = 0;
                let regs = 0;
                let dataFound = false;

                // Prejdeme všetky riadky a hľadáme prvý, kde sú v prvých dvoch bunkách čísla
                for (let i = 0; i < rows.length; i++) {
                    const columns = rows[i].split(/[;,]/); // Rozdelíme podľa čiarky alebo bodkočiarky
                    
                    const valA = cleanNumber(columns[0]);
                    const valB = cleanNumber(columns[1]);

                    // Ak sú obe bunky čísla a aspoň jedno je väčšie ako 0 (ignorujeme hlavičku)
                    if (!isNaN(valA) && !isNaN(valB) && (valA > 0 || valB > 0)) {
                        cpi = valA;
                        regs = valB;
                        dataFound = true;
                        break;
                    }
                }

                if (!dataFound) {
                    throw new Error("V tabuľke som nenašiel riadok s číslami. Skontroluj bunky A2 a B2.");
                }

                render(cpi * regs);

            } catch (err) {
                console.error(err);
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('error-screen').classList.remove('hidden');
                document.getElementById('debug-info').innerText = err.message;
            }
        }

        // FUNKCIA NA ČISTENIE TEXTU NA ČÍSLO
        function cleanNumber(text) {
            if (!text) return NaN;
            // Odstrániť úvodzovky, medzery, € znaky, percentá
            let s = text.replace(/"/g, '').replace(/\s/g, '').replace('€', '');
            // Zmeniť slovenskú čiarku na bodku pre JavaScript
            s = s.replace(',', '.');
            return parseFloat(s);
        }

        function render(total) {
            document.getElementById('loading-screen').classList.add('hidden');
            const main = document.getElementById('main-content');
            main.classList.remove('hidden');
            main.classList.add('bounce');
            
            const el = document.getElementById('total-amount');
            
            // Animácia od nuly po cieľ
            let current = 0;
            const step = total / 60; // 60 snímkov
            
            const timer = setInterval(() => {
                current += step;
                if (current >= total) {
                    current = total;
                    clearInterval(timer);
                }
                el.innerText = current.toLocaleString('sk-SK', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }) + '€';
            }, 20);
        }

        start();
    </script>
</body>
</html>
